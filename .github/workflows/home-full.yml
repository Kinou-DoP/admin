# Après chaque publication de l'accueil, du spotlight ou d'une fiche (spotlight : lecture de toute la bande) : ajoute le film complet qui manque (slides de l'accueil,
# vidéos ajoutées sous un film, images des projets en images seulement), lu sur Slate (tools/fill-home.mjs). Gratuit (dépôt public), aucune mise en ligne Netlify.
name: Films complets (accueil et vidéos sous un film)
on:
  push:
    branches: [main]
    paths: [data/home.json, data/spotlight.json, data/fiction.json, "data/dps/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: home-full
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Publication : fiches modifiées par ce commit ; lancement manuel : toutes les fiches.
      - run: CHANGED="$(git diff --name-only HEAD~1 HEAD || true)" node tools/fill-home.mjs
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Enregistrer
        run: |
          if ! git diff --quiet; then
            git config user.name "kinou-robot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Films complets et images des projets (lus sur Slate)"
            git pull --rebase origin main && git push
            # Le site garde les données 5 min en cache : on le vide pour que les images / films ajoutés se voient tout de suite
            # (sinon la publication de l'admin, juste avant, a déjà remis en cache la version sans eux).
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" https://beta--kinou-test.netlify.app/api/refresh/robot || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
