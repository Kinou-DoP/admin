# Après chaque publication de l'accueil ou d'une fiche : ajoute le film complet qui manque (slides de l'accueil,
# vidéos ajoutées sous un film), lu sur Slate (tools/fill-home.mjs). Gratuit (dépôt public), aucune mise en ligne Netlify.
name: Films complets (accueil et vidéos sous un film)
on:
  push:
    branches: [main]
    paths: [data/home.json, "data/dps/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: home-full
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fill-home.mjs
      - name: Enregistrer
        run: |
          if ! git diff --quiet; then
            git config user.name "kinou-robot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Films complets (lus sur Slate)"
            git pull --rebase origin main && git push
          fi
