# Après chaque publication de l'accueil (data/home.json) : ajoute le film complet des slides qui n'en ont pas,
# lu sur la bande Slate (tools/fill-home.mjs). Gratuit (dépôt public), aucune mise en ligne Netlify.
name: Films complets de l'accueil
on:
  push:
    branches: [main]
    paths: [data/home.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: home-full
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fill-home.mjs
      - name: Enregistrer
        run: |
          if ! git diff --quiet; then
            git config user.name "kinou-robot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Accueil : films complets (lus sur la bande Slate)"
            git pull --rebase origin main && git push
          fi
