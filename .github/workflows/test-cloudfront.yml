# Test (25/11) : vitesse des extraits (snippets du 1er film FEATURED de chefs op, adresses publiques des fiches) sur notre
# CloudFront (d3toxii6rvamjf) et celui de Slate : 1re demande (froide) puis 2e (en mémoire), en-têtes de cache. Ne modifie rien.
name: Test CloudFront
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vitesse des extraits
        run: |
          F='%{http_code} début %{time_starttransfer}s total %{time_total}s %{size_download}o'
          for k in kinou/production/clips/11004/0ae1be11-6eeb-11f1-a349-0215583debcb.mp4 kinou/production/clips/10696/8fa217ca-cdf9-11f1-a349-0215583debcb.mp4 kinou/production/clips/10391/7c3cee06-fb7e-11f0-9ce3-0215583debcb.mp4 kinou/production/clips/8959/90ac6f2d-cefc-11f1-a349-0215583debcb.mp4 kinou/production/clips/5244/e1d3c0df-d3ae-11f1-a349-0215583debcb.mp4 kinou/production/clips/11340/dd6be064-c3bb-11f1-a349-0215583debcb.mp4 kinou/production/clips/11008/8cb2c4bd-70bb-11f1-a349-0215583debcb.mp4 kinou/production/clips/9231/4b9cbb9f-b19d-11ef-bfce-022353abf6f5.mp4; do
            echo "== ${k: -45}"
            for h in d3toxii6rvamjf d1ko11x0ybxl0h; do
              a=$(curl -s -o /dev/null -w "$F" "https://$h.cloudfront.net/$k"); b=$(curl -s -o /dev/null -w "$F" "https://$h.cloudfront.net/$k")
              hd=$(curl -sI "https://$h.cloudfront.net/$k" | grep -iE "^(x-cache|cache-control|age|content-type):" | tr -d '\r' | tr '\n' ' ')
              echo "  $h  1re: $a | 2e: $b"; echo "     $hd"
            done
          done
