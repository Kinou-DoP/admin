# Encodage du video club (tools/encodage.mjs) : version web 1080p, vignettes WebP et extraits 720p sans son, fabriqués chez Amazon
# à la demande de l'admin (fichiers data/encode/film-*.json et rapide-*.json). Deux files : les films (longs) et le reste (extraits,
# vignettes : quelques secondes), pour qu'un long film n'en retarde pas un petit extrait. Accès Amazon sans clé (rôle
# kinou-robot-copie, branche main). Gratuit (dépôt public). Un passage traite toutes les demandes en attente de sa file.
name: Encodage (video club)
on:
  push:
    branches: [main]
    paths: ["data/encode/**"]
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency: encodage-film
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919012714656:role/kinou-robot-copie
          aws-region: eu-north-1
      - run: node tools/encodage.mjs
        env:
          AWS_ROLE_COPIE: arn:aws:iam::919012714656:role/kinou-robot-copie
          KINDS: ${{ github.job }}
  rapide:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: encodage-rapide
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919012714656:role/kinou-robot-copie
          aws-region: eu-north-1
      - run: node tools/encodage.mjs
        env:
          AWS_ROLE_COPIE: arn:aws:iam::919012714656:role/kinou-robot-copie
          KINDS: ${{ github.job }}
